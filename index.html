<!DOCTYPE html>
<html>
<head>
<title>Mustabshira's Cat</title>
<style>
body { background:#ffe6f2; text-align:center; font-family:Arial; padding:50px; }
.cat { font-size:100px; }
h1 { color:#ff1493; }
button { padding:15px 30px; font-size:20px; background:#ff69b4; color:white; border:none; border-radius:10px; cursor:pointer; }
</style>
</head>
<body>
<h1>Mustabshira's Cute Cat</h1>
<div class="cat" id="cat">😺</div>
<h2 id="text">Meow! Click to feed me!</h2>
<button onclick="feed()">Feed Fish 🐟</button>
<script>
let count=0;
function feed(){
count++;
document.getElementById('text').innerText="Yummy! Fed "+count+" times! Meow!";
document.getElementById('cat').innerText=count%2==0?"😸":"😻";
}
</script>
</body>
</html>
